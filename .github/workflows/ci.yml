name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

      # A green build only proves the bundle compiles. The Vite 8 bump (#79)
      # built clean and then threw React error #130 on mount, taking the whole
      # app down while CI stayed green. This loads the built bundle and checks
      # it actually renders. Kept inside this job so it runs against the
      # artifact just built, and so the existing required check covers it --
      # do not rename this job, the master ruleset requires it by name.
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (production bundle mounts)
        run: |
          npm start &
          timeout 60 bash -c 'until curl -sf http://localhost:10000 >/dev/null; do sleep 1; done'
          npm run smoke

  backend:
    name: Backend build (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
