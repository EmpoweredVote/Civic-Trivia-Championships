name: Post-deploy smoke

# Render auto-deploys on commits to master and gives GitHub no signal when it has
# finished. This waits for the pushed commit to actually be live, then loads the
# site in real Chromium and asserts the app mounted with the real API behind it.
#
# It exists because a green `tsc && vite build` is not evidence the app runs: the
# Vite 8 bump (#79, reverted in b5321df) built clean and then threw React error
# #130 on mount, so every page rendered as the error boundary while CI stayed
# green. That outage was found by hand.
#
# FRONTEND is confirmed by commit, because nothing else identifies a build:
# process uptime says a restart happened but not which build restarted, and the
# bundle hash is not comparable to a CI build since Render builds with
# dashboard-only env vars (CI produced index-CVOqwpXo.js while prod served
# index-Dhz6HpDW.js for identical source). So the frontend build emits
# RENDER_GIT_COMMIT to /build-info.json and this polls until it matches.
#
# BACKEND cannot be confirmed by commit from this repo, and deliberately is not.
# Production CTC requests are served by the ev-accounts *engine*, which mounts a
# copy of CTC's routers at api.empowered.vote/ctc — see
# HANDOFF-engine-consolidation-VQ-CTC.md. Two consequences:
#   - any SHA that engine reports is an ev-accounts SHA, never one of ours
#   - its copy predates this repo's commit marker, so /ctc/health/live answers
#     {status, uptime} with no commit field at all
# The old dedicated civic-trivia-backend service this workflow used to point at
# is suspended and serves no traffic, so checking it proved nothing. The backend
# half is therefore a health check: is the API production actually uses
# answering? That is the honest question this repo can ask about the backend.
#
# Only the frontend is commit-checked, and only when the push touched it. The
# static site has rootDir: frontend and Render skips a build when nothing under
# it changed, so a backend-or-docs-only commit legitimately leaves the frontend
# on an older SHA — waiting for it would hang forever.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A burst of pushes should only smoke the final state, not queue one run each.
  group: post-deploy-smoke
  cancel-in-progress: true

env:
  PROD_URL: https://ctc.empowered.vote
  # The engine, not the retired civic-trivia-backend service. This is the base
  # the deployed bundle actually calls.
  API_BASE: https://api.empowered.vote/ctc

jobs:
  smoke:
    name: Prod smoke (ctc.empowered.vote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the parent commit to see which paths this push touched.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Which services did this push change?
        id: changed
        working-directory: .
        run: |
          # workflow_dispatch, or a first commit with no parent: check both.
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "no parent commit or manual run — checking both services"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only HEAD^ HEAD)
          echo "changed paths:"; echo "$files" | sed 's/^/  /'

          # if-blocks, not `grep -q ... && var=true`: under `bash -e` a grep that
          # matches nothing returns 1 and would kill the step.
          frontend=false; backend=false
          if echo "$files" | grep -q '^frontend/'; then frontend=true; fi
          if echo "$files" | grep -q '^backend/';  then backend=true;  fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "-> frontend=$frontend backend=$backend"

      - name: Wait for this commit to be live
        id: wait
        run: |
          sha="${{ github.sha }}"
          want_front="${{ steps.changed.outputs.frontend }}"
          touched_back="${{ steps.changed.outputs.backend }}"

          front_commit() { curl -sf -H 'Cache-Control: no-cache' \
            "${PROD_URL}/build-info.json?cb=$(date +%s)" 2>/dev/null | jq -r '.commit // empty'; }
          # Health, not commit — see the BACKEND note at the top of this file.
          api_status()   { curl -s -o /dev/null -w '%{http_code}' "${API_BASE}/health/live" 2>/dev/null || echo 000; }

          front_ok=$([ "$want_front" = "true" ] && echo no || echo skipped)
          back_ok=no   # always checked: any deploy can break the API the app calls

          # backend/ in this repo no longer reaches production — the engine serves
          # its own copy. Say so rather than implying this run verified it.
          if [ "$touched_back" = "true" ]; then
            echo "::warning::This push changed backend/, but production CTC is served by the ev-accounts engine's copy of these routers. Nothing here deploys it — port the change to ev-accounts. See HANDOFF-engine-consolidation-VQ-CTC.md."
          fi

          # ~15 min. Deploys usually land in 30-90s, but the first run of this
          # check gave up at 6m while the frontend deploy took 10m48s in a queue —
          # a red run caused by the window, not by a bad deploy. The smoke below is
          # the assertion and this step only synchronises with the deploy, so
          # waiting too long merely delays the signal while waiting too little
          # invents failures. Err long.
          #
          # Written as if-blocks, not `[ ... ] && ...` chains: the step runs under
          # `bash -e`, where a chain whose first test fails returns non-zero as the
          # last command of the list and kills the step.
          for i in $(seq 1 90); do
            if [ "$front_ok" = "no" ] && [ "$(front_commit)" = "$sha" ]; then
              front_ok=yes
              echo "frontend live at $sha after $((i*10))s"
            fi
            if [ "$back_ok" = "no" ] && [ "$(api_status)" = "200" ]; then
              back_ok=yes
              echo "API healthy at ${API_BASE} after $((i*10))s"
            fi
            if [ "$front_ok" != "no" ] && [ "$back_ok" != "no" ]; then
              break
            fi
            sleep 10
          done

          echo "front_state=$front_ok" >> "$GITHUB_OUTPUT"
          echo "back_state=$back_ok"   >> "$GITHUB_OUTPUT"
          echo "result: frontend=$front_ok backend=$back_ok"

          # A changed frontend that never reports this SHA means the deploy did not
          # land. Failing is correct: smoking the previous build would pass and
          # report false assurance, which is the exact gap this check closes.
          if [ "$front_ok" = "no" ]; then
            echo "::error::Frontend deploy not confirmed within 15m (expected $sha). Prod may still be serving the previous build — check Render."
            exit 1
          fi
          # The API the app calls never answered 200. The smoke below would show
          # only a symptom (a near-empty page), so name the cause here.
          if [ "$back_ok" = "no" ]; then
            echo "::error::${API_BASE}/health/live never returned 200 within 15m. The engine serving CTC is down or unreachable."
            exit 1
          fi

      - name: Smoke production
        env:
          SMOKE_URL: ${{ env.PROD_URL }}/
          # Let the real API through: on a deployed site the point is to prove the
          # whole chain works, not just that the bundle parses. This mode is what
          # confirmed the CORS change in 30079b7 had not broken the live
          # frontend's own origin.
          SMOKE_ALLOW_EXTERNAL: '1'
        run: npm run smoke

      - name: Report
        if: always()
        run: |
          {
            echo "### Prod smoke — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| frontend (commit confirmed) | ${{ steps.wait.outputs.front_state }} |"
            echo "| API health (\`${API_BASE}\`) | ${{ steps.wait.outputs.back_state }} |"
            echo ""
            echo "_Frontend \`skipped\` means the push touched nothing under \`frontend/\`, so Render did not redeploy it._"
            echo "_The API is health-checked, not commit-checked: production CTC is served by the ev-accounts engine's copy of these routers, so no SHA from this repo ever appears there. See \`HANDOFF-engine-consolidation-VQ-CTC.md\`._"
          } >> "$GITHUB_STEP_SUMMARY"
