name: Post-deploy smoke

# Render auto-deploys on every commit to master and gives GitHub no signal when
# it has finished. This waits for the new bundle to appear on the live site, then
# loads it in a real browser and asserts the app mounts.
#
# It exists because a green `tsc && vite build` is not evidence the app runs: the
# Vite 8 bump (#79) built clean and then threw React error #130 on mount, so every
# page rendered as the error boundary while CI stayed green. That outage was found
# by hand. This finds the next one.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A burst of pushes should only smoke the final state, not queue one run each.
  group: post-deploy-smoke
  cancel-in-progress: true

env:
  PROD_URL: https://ctc.empowered.vote/

jobs:
  smoke:
    name: Prod smoke (ctc.empowered.vote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Built here only to learn the content hash this commit produces, so the
      # wait below can tell "prod is serving THIS commit" from "prod is still
      # serving the previous one". Both this and Render build on Linux with the
      # same lockfile, so the hashes line up.
      - name: Build to learn this commit's bundle hash
        run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Wait for Render to serve this commit
        id: wait
        run: |
          bundle_of() {
            curl -sf -H 'Cache-Control: no-cache' "${PROD_URL}?cb=$(date +%s)" 2>/dev/null \
              | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1
          }

          expected=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          initial=$(bundle_of || true)
          echo "expected from this commit : ${expected:-<none>}"
          echo "live at workflow start    : ${initial:-<unreachable>}"

          # ~10 minutes. Render frontend deploys land in well under a minute; the
          # headroom is for a queued or retried build.
          for i in $(seq 1 40); do
            live=$(bundle_of || true)
            if [ -n "$live" ] && [ "$live" = "$expected" ]; then
              echo "matched this commit's bundle after $((i*15))s"
              echo "confirmed=exact" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$live" ] && [ -n "$initial" ] && [ "$live" != "$initial" ]; then
              echo "bundle changed ($initial -> $live) after $((i*15))s"
              echo "confirmed=changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done

          # Deliberately not a failure. The smoke test below is the assertion; this
          # step only syncs with the deploy. Failing here would turn a slow deploy,
          # or a rebuild that happens to emit an identical bundle, into a red run
          # that means nothing — and a check that cries wolf gets ignored.
          echo "::warning::Could not confirm the new bundle within 10m (live=${live:-unreachable}, expected=${expected:-unknown}). Smoking whatever prod is serving."
          echo "confirmed=unconfirmed" >> "$GITHUB_OUTPUT"

      - name: Smoke production
        env:
          SMOKE_URL: ${{ env.PROD_URL }}
          # Let the real API through: on a deployed site the point is to prove the
          # whole chain works, not just that the bundle mounts. This is what caught
          # that the CORS change had not broken the live frontend's own origin.
          SMOKE_ALLOW_EXTERNAL: '1'
        run: npm run smoke

      - name: Report
        if: always()
        run: |
          echo "### Prod smoke — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: ${PROD_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy sync: \`${{ steps.wait.outputs.confirmed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
