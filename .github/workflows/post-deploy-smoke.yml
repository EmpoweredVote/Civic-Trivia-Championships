name: Post-deploy smoke

# Render auto-deploys on commits to master and gives GitHub no signal when it has
# finished, so nothing verified that what actually shipped runs. The Vite 8 outage
# (#79, reverted in b5321df) was found by hand; this is meant to find the next one.
#
# It waits for both services to answer, then loads the live site in real Chromium
# and asserts the app mounted with the real API behind it.
#
# Why there is no "wait for the new frontend bundle" step: the static site has
# rootDir: frontend, and Render skips a build when nothing under it changed. Most
# commits here are backend-only, so there is often no new frontend deploy to wait
# for — yet those commits can still break the live site (30079b7 changed CORS,
# which is exactly how the deployed frontend reaches its API). Keying the check to
# a bundle change would have skipped the commits most able to break production.
#
# Matching the served bundle against a locally built one does not work either:
# Render builds with env vars that only exist in its dashboard, so its bundle hash
# differs from CI's for identical source.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A burst of pushes should only smoke the final state, not queue one run each.
  group: post-deploy-smoke
  cancel-in-progress: true

env:
  PROD_URL: https://ctc.empowered.vote/
  API_HEALTH: https://civic-trivia-backend.onrender.com/health/live

jobs:
  smoke:
    name: Prod smoke (ctc.empowered.vote)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Wait for both services to answer
        id: wait
        run: |
          # Setup above already takes a couple of minutes and Render deploys land
          # in well under one, so this is usually satisfied on the first poll. The
          # headroom covers a queued build or a backend restart.
          ok=""
          for i in $(seq 1 24); do   # 24 * 10s = 4 min
            front=$(curl -s -o /dev/null -w '%{http_code}' "${PROD_URL}?cb=$(date +%s)" || echo 000)
            api=$(curl -s -o /dev/null -w '%{http_code}' "${API_HEALTH}" || echo 000)
            if [ "$front" = "200" ] && [ "$api" = "200" ]; then
              echo "both up after $((i*10))s (frontend=$front api=$api)"
              ok=1
              break
            fi
            echo "  waiting: frontend=$front api=$api"
            sleep 10
          done

          # Not a hard failure: the smoke step below is the assertion, and it will
          # fail loudly with real detail if the site is genuinely down. Failing here
          # would just report "curl got a non-200" with less information.
          if [ -z "$ok" ]; then
            echo "::warning::Services did not both return 200 within 4m (frontend=$front api=$api). Smoking anyway."
          fi

          served=$(curl -s -H 'Cache-Control: no-cache' "${PROD_URL}?cb=$(date +%s)" \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "serving: ${served:-unknown}"
          echo "served=${served:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Smoke production
        env:
          SMOKE_URL: ${{ env.PROD_URL }}
          # Let the real API through: on a deployed site the point is to prove the
          # whole chain works, not just that the bundle parses. This mode is what
          # confirmed the CORS change in 30079b7 had not broken the live
          # frontend's own origin.
          SMOKE_ALLOW_EXTERNAL: '1'
        run: npm run smoke

      - name: Report
        if: always()
        run: |
          {
            echo "### Prod smoke — ${{ job.status }}"
            echo ""
            echo "- target: ${PROD_URL}"
            echo "- bundle served: \`${{ steps.wait.outputs.served }}\`"
            echo "- commit pushed: \`${{ github.sha }}\`"
            echo ""
            echo "_The served bundle is whatever Render currently hosts; it only changes when a commit touches \`frontend/\`._"
          } >> "$GITHUB_STEP_SUMMARY"
